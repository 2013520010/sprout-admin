server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: sprout-admin
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.sprout.**.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 自定义配置
sprout:
  jwt:
    # 令牌密钥（生产环境务必修改，至少 32 字节）
    secret: sprout-admin-secret-key-please-change-me-2024
    # 过期时间（分钟）
    expire-minutes: 120
    # 请求头名称
    header: Authorization
    # 令牌前缀
    prefix: "Bearer "

# Knife4j 接口文档
knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
